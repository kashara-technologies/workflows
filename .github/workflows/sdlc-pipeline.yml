name: SDLC Pipeline

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_KEY:
        required: true
      ORCHESTRATOR_APP_ID:
        required: true
      ORCHESTRATOR_APP_INSTALLATION_ID:
        required: true
      ORCHESTRATOR_APP_PRIVATE_KEY:
        required: true
      SLACK_WEBHOOK_CRITICAL:
        required: true
      SLACK_WEBHOOK_WARNING:
        required: true
      SLACK_WEBHOOK_INFO:
        required: true
      POSTHOG_KEY:
        required: false
      POSTHOG_HOST:
        required: false

concurrency:
  group: sdlc-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-prd:
    name: Detect changed PRD
    runs-on: ubuntu-latest
    outputs:
      prd_path: ${{ steps.find-prd.outputs.prd_path }}
      product: ${{ steps.find-prd.outputs.product }}
      feature: ${{ steps.find-prd.outputs.feature }}
      should_run: ${{ steps.find-prd.outputs.should_run }}
    steps:
      - name: Check out caller repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find the PRD that changed in this push
        id: find-prd
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'docs/product/**/*.md' || true)
          else
            CHANGED=$(git ls-files 'docs/product/**/*.md' || true)
          fi

          echo "Changed PRD files:"
          echo "$CHANGED"
          echo ""

          PRD_PATH=$(echo "$CHANGED" | head -1)

          if [[ -z "$PRD_PATH" ]]; then
            echo "No PRD changed. Skipping pipeline."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$PRD_PATH" =~ ^docs/product/([^/]+)/([^/]+)\.md$ ]]; then
            echo "::error::PRD path doesn't match docs/product/<product>/<feature>.md: $PRD_PATH"
            exit 1
          fi

          PRODUCT="${BASH_REMATCH[1]}"
          FEATURE="${BASH_REMATCH[2]}"

          echo "prd_path=$PRD_PATH" >> "$GITHUB_OUTPUT"
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "feature=$FEATURE" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "PRD: $PRD_PATH"
          echo "Product: $PRODUCT"
          echo "Feature: $FEATURE"

  run-pipeline:
    name: Run SDLC pipeline
    needs: detect-prd
    if: needs.detect-prd.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      coder_retries_exhausted: ${{ steps.orchestrator.outputs.coder_retries_exhausted }}
      budget_kill_switch_tripped: ${{ steps.orchestrator.outputs.budget_kill_switch_tripped }}

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ORCHESTRATOR_APP_ID: ${{ secrets.ORCHESTRATOR_APP_ID }}
      ORCHESTRATOR_APP_INSTALLATION_ID: ${{ secrets.ORCHESTRATOR_APP_INSTALLATION_ID }}
      ORCHESTRATOR_APP_PRIVATE_KEY: ${{ secrets.ORCHESTRATOR_APP_PRIVATE_KEY }}
      # Forwarded from caller (e.g. pulse's sdlc.yml). When set, the
      # orchestrator refuses to start a new run if the current month's
      # agent_runs.cost_usd is over this value.
      SDLC_MONTHLY_KILL_SWITCH_USD: ${{ vars.SDLC_MONTHLY_KILL_SWITCH_USD }}
      # PostHog telemetry (EU instance per Frankfurt residency posture).
      # Either missing -> telemetry disabled, pipeline still runs.
      POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
      # Dry-run mode. When SDLC_DRY_RUN is "1" or "true" the orchestrator
      # replays scripts/sdlc/fixtures/<agent>.json instead of calling the
      # Anthropic API. Default unset.
      SDLC_DRY_RUN: ${{ vars.SDLC_DRY_RUN }}

    steps:
      - name: Check out caller repo
        uses: actions/checkout@v4
        with:
          path: target-repo
          fetch-depth: 0

      - name: Check out workflows repo (for orchestrator code)
        uses: actions/checkout@v4
        with:
          repository: kashara-technologies/workflows
          ref: main
          path: workflows-repo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workflows-repo/pnpm-lock.yaml

      - name: Install orchestrator dependencies
        working-directory: workflows-repo
        run: pnpm install --frozen-lockfile

      - name: Typecheck orchestrator
        working-directory: workflows-repo
        run: pnpm typecheck

      - name: Run orchestrator
        id: orchestrator
        env:
          TARGET_REPO_PATH: ${{ github.workspace }}/target-repo
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        working-directory: workflows-repo
        run: |
          set -euo pipefail
          echo "::group::Orchestrator output"
          # The orchestrator writes one of these marker files into
          # $GITHUB_WORKSPACE when a specific failure family fires. The Slack
          # alert step downstream reads them to pick the routing severity.
          RETRIES_MARKER="${GITHUB_WORKSPACE}/.coder-retries-exhausted"
          BUDGET_MARKER="${GITHUB_WORKSPACE}/.budget-kill-switch-tripped"
          rm -f "$RETRIES_MARKER" "$BUDGET_MARKER"

          # Don't fail the script on a non-zero orchestrator exit; the markers
          # carry the diagnostic, and we want the marker-export step to run
          # regardless.
          set +e
          pnpm orchestrator "${{ needs.detect-prd.outputs.prd_path }}"
          ORCH_RC=$?
          set -e

          if [[ -f "$RETRIES_MARKER" ]]; then
            echo "coder_retries_exhausted=true" >> "$GITHUB_OUTPUT"
          else
            echo "coder_retries_exhausted=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$BUDGET_MARKER" ]]; then
            echo "budget_kill_switch_tripped=true" >> "$GITHUB_OUTPUT"
            cat "$BUDGET_MARKER"
          else
            echo "budget_kill_switch_tripped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"
          exit $ORCH_RC

  notify-failure:
    name: Notify Slack on failure
    needs: [detect-prd, run-pipeline]
    if: failure()
    uses: kashara-technologies/workflows/.github/workflows/slack-alert.yml@main
    with:
      job_name: ${{ needs.run-pipeline.result == 'failure' && 'Run SDLC pipeline' || 'Detect changed PRD' }}
      workflow_name: SDLC Pipeline (${{ github.repository }})
      severity: ${{ (needs.run-pipeline.outputs.coder_retries_exhausted == 'true' || needs.run-pipeline.outputs.budget_kill_switch_tripped == 'true') && 'critical' || 'warning' }}
    secrets:
      SLACK_WEBHOOK_CRITICAL: ${{ secrets.SLACK_WEBHOOK_CRITICAL }}
      SLACK_WEBHOOK_WARNING: ${{ secrets.SLACK_WEBHOOK_WARNING }}
      SLACK_WEBHOOK_INFO: ${{ secrets.SLACK_WEBHOOK_INFO }}
